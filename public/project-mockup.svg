<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main container with background and border -->
  <rect width="800" height="450" fill="#FFFFFF" rx="24"/>
  <rect x="0.5" y="0.5" width="799" height="449" rx="23.5" stroke="#E5E7EB" stroke-opacity="0.8"/>

  <!-- Title -->
  <text x="40" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#111827">Income vs Expenses</text>

  <!-- Grid Lines -->
  <g stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="90" x2="760" y2="90" />
    <line x1="100" y1="160" x2="760" y2="160" />
    <line x1="100" y1="230" x2="760" y2="230" />
    <line x1="100" y1="300" x2="760" y2="300" />
    <line x1="100" y1="370" x2="760" y2="370" />
  </g>

  <!-- Y-axis Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280" text-anchor="end">
    <text x="80" y="94">2200</text>
    <text x="80" y="164">1650</text>
    <text x="80" y="234">1100</text>
    <text x="80" y="304">550</text>
    <text x="80" y="374">0</text>
  </g>

  <!-- X-axis Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
    <text x="140" y="390">ene</text>
    <text x="195" y="390">feb</text>
    <text x="250" y="390">mar</text>
    <text x="305" y="390">abr</text>
    <text x="360" y="390">may</text>
    <text x="415" y="390">jun</text>
    <text x="470" y="390">jul</text>
    <text x="525" y="390">ago</text>
    <text x="580" y="390">sep</text>
    <text x="635" y="390">oct</text>
    <text x="690" y="390">nov</text>
    <text x="745" y="390">dic</text>
  </g>

  <!-- Bars -->
  <g>
    <!-- Expenses (Red) -->
    <rect x="130" y="322" width="20" height="48" fill="#EF4444" rx="2"/>
    <rect x="185" y="254" width="20" height="116" fill="#EF4444" rx="2"/>
    
    <!-- Income (Green - using site's primary color) -->
    <rect x="150" y="90" width="20" height="280" fill="#10B981" rx="2"/>
    <rect x="205" y="336" width="20" height="34" fill="#10B981" rx="2"/>
  </g>

  <!-- Legend -->
  <g transform="translate(320, 410)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">
    <rect x="0" y="0" width="12" height="12" fill="#EF4444" rx="2"/>
    <text x="18" y="10">expenses</text>
    <rect x="80" y="0" width="12" height="12" fill="#10B981" rx="2"/>
    <text x="98" y="10">income</text>
  </g>
</svg>