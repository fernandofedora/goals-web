<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="200%" height="200%">
      <feOffset in="SourceAlpha" dx="0" dy="18" result="off"/>
      <feGaussianBlur in="off" stdDeviation="28" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.10
                0 0 0 0 0.08
                0 0 0 0.30 0"
        result="shadow"/>
      <feBlend in="SourceGraphic" in2="shadow" mode="normal"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <g filter="url(#softShadow)">
    <rect x="160" y="110" width="640" height="320" rx="32" fill="#F9FAFB"/>
    <rect x="176" y="126" width="608" height="288" rx="24" fill="white"/>

    <g transform="translate(216, 166)">
      <rect x="0" y="0" width="528" height="200" rx="24" fill="#F1F5F9"/>

      <path
        d="
          M 24 150
          Q 88 120 136 136
          T 248 110
          T 344 134
          T 448 96
          T 504 118
        "
        fill="none"
        stroke="url(#area)"
        stroke-width="4"
        stroke-linecap="round"/>

      <path
        d="
          M 24 150
          Q 88 120 136 136
          T 248 110
          T 344 134
          T 448 96
          T 504 118
          L 504 176
          L 24 176
          Z
        "
        fill="url(#area)"
        opacity="0.18"/>

      <line x1="24" y1="60" x2="24" y2="176" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="144" y1="60" x2="144" y2="176" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="264" y1="60" x2="264" y2="176" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="384" y1="60" x2="384" y2="176" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="504" y1="60" x2="504" y2="176" stroke="#E5E7EB" stroke-width="1"/>

      <circle cx="136" cy="136" r="5" fill="white" stroke="#22C55E" stroke-width="3"/>
      <circle cx="248" cy="110" r="5" fill="white" stroke="#22C55E" stroke-width="3"/>
      <circle cx="344" cy="134" r="5" fill="white" stroke="#22C55E" stroke-width="3"/>
      <circle cx="448" cy="96" r="5" fill="white" stroke="#22C55E" stroke-width="3"/>
    </g>
  </g>
</svg>
